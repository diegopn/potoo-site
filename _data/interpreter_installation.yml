pt-BR:
  heading: "Instalação do executor de terminal"
  release_intro: "Os binários publicados estão na"
  release_link: "página de Releases"
  release_details: "Escolha a versão e o pacote do seu sistema; baixe também o arquivo SHA256SUMS. Compare o hash do pacote com a linha correspondente antes de executá-lo. Salve apenas o pacote escolhido e SHA256SUMS na mesma pasta. Esses executáveis são independentes e não instalam o Potoo IDE."
  platform_note: "Há pacotes para Linux x86_64, Windows x86_64 e macOS Intel (x86_64). Os binários para macOS não contemplam Apple Silicon."
  linux_heading: "Linux x86_64"
  linux_text: "Baixe o arquivo .tar.gz cujo nome termina em x86_64-unknown-linux-gnu.tar.gz. No terminal, execute os comandos na pasta onde salvou o pacote e SHA256SUMS. Depois, adicione ~/.local/bin ao perfil do seu shell para manter o comando disponível em novas sessões."
  windows_heading: "Windows x86_64"
  windows_text: "Baixe o arquivo .zip cujo nome termina em x86_64-pc-windows-msvc.zip e execute os comandos no PowerShell, na pasta onde salvou o pacote e SHA256SUMS. Para chamar o executável de qualquer pasta, adicione ao PATH do usuário a pasta que contém o arquivo .exe."
  macos_heading: "macOS Intel"
  macos_text: "Baixe o arquivo .tar.gz cujo nome termina em x86_64-apple-darwin.tar.gz. No Terminal, execute os comandos na pasta onde salvou o pacote e SHA256SUMS. Os binários publicados são para Macs Intel; Apple Silicon não é suportado nesta versão."
  source_heading: "Instalar a partir do código-fonte"
  source_text: "Como alternativa aos pacotes publicados, é possível compilar o executor no próprio sistema. É necessário ter Rust 1.93 ou posterior, Cargo e acesso à internet."
  run_note: "Depois da instalação, execute o comando e informe um arquivo-fonte como argumento."
  example_note: "Substitua o arquivo de exemplo mostrado no comando pelo caminho de um arquivo existente; o pacote não inclui esse arquivo."
  profile_note: "Para manter o caminho nas próximas sessões, inclua a mesma linha no arquivo ~/.profile ou no perfil do shell usado."
es:
  heading: "Instalación del ejecutor de terminal"
  release_intro: "Los binarios publicados están en la"
  release_link: "página de Releases"
  release_details: "Elige la versión y el paquete de tu sistema; descarga también el archivo SHA256SUMS. Compara el hash del paquete con la línea correspondiente antes de ejecutarlo. Guarda solo el paquete elegido y SHA256SUMS en la misma carpeta. Estos ejecutables son independientes y no instalan Potoo IDE."
  platform_note: "Hay paquetes para Linux x86_64, Windows x86_64 y macOS Intel (x86_64). Los binarios para macOS no incluyen Apple Silicon."
  linux_heading: "Linux x86_64"
  linux_text: "Descarga el archivo .tar.gz cuyo nombre termina en x86_64-unknown-linux-gnu.tar.gz. En la terminal, ejecuta los comandos en la carpeta donde guardaste el paquete y SHA256SUMS. Después, añade ~/.local/bin al perfil de tu shell para mantener el comando disponible en nuevas sesiones."
  windows_heading: "Windows x86_64"
  windows_text: "Descarga el archivo .zip cuyo nombre termina en x86_64-pc-windows-msvc.zip y ejecuta los comandos en PowerShell, en la carpeta donde guardaste el paquete y SHA256SUMS. Para iniciar el ejecutable desde cualquier carpeta, añade al PATH del usuario la carpeta que contiene el archivo .exe."
  macos_heading: "macOS Intel"
  macos_text: "Descarga el archivo .tar.gz cuyo nombre termina en x86_64-apple-darwin.tar.gz. En Terminal, ejecuta los comandos en la carpeta donde guardaste el paquete y SHA256SUMS. Los binarios publicados son para Mac Intel; Apple Silicon no está soportado en esta versión."
  source_heading: "Instalar desde el código fuente"
  source_text: "Como alternativa a los paquetes publicados, puedes compilar el ejecutor en tu propio sistema. Necesitas Rust 1.93 o posterior, Cargo y conexión a internet."
  run_note: "Después de instalarlo, ejecuta el comando e indica un archivo fuente como argumento."
  example_note: "Sustituye el archivo de ejemplo mostrado en el comando por la ruta de un archivo existente; el paquete no lo incluye."
  profile_note: "Para conservar la ruta en futuras sesiones, añade la misma línea al archivo ~/.profile o al perfil de shell que uses."
en:
  heading: "Install the command-line runner"
  release_intro: "Published binaries are available on the"
  release_link: "Releases page"
  release_details: "Choose a version and the package for your system; also download SHA256SUMS. Compare the package hash with its matching entry before running it. Save only the selected package and SHA256SUMS in the same folder. These executables are standalone and do not install Potoo IDE."
  platform_note: "Packages are available for Linux x86_64, Windows x86_64, and Intel macOS (x86_64). The published macOS binaries do not include Apple silicon."
  linux_heading: "Linux x86_64"
  linux_text: "Download the .tar.gz file whose name ends in x86_64-unknown-linux-gnu.tar.gz. In a terminal, run the commands from the folder containing the package and SHA256SUMS. Then add ~/.local/bin to your shell profile to keep the command available in new sessions."
  windows_heading: "Windows x86_64"
  windows_text: "Download the .zip file whose name ends in x86_64-pc-windows-msvc.zip and run the commands in PowerShell from the folder containing the package and SHA256SUMS. To launch the executable from any folder, add the folder containing the .exe to your user PATH."
  macos_heading: "Intel macOS"
  macos_text: "Download the .tar.gz file whose name ends in x86_64-apple-darwin.tar.gz. In Terminal, run the commands from the folder containing the package and SHA256SUMS. Published binaries are for Intel Macs; Apple silicon is not supported in this version."
  source_heading: "Install from source"
  source_text: "As an alternative to the published packages, you can compile the runner on your system. You need Rust 1.93 or later, Cargo, and internet access."
  run_note: "After installation, run the command with a source file as its argument."
  example_note: "Replace the sample file shown in the command with the path to an existing file; the package does not include it."
  profile_note: "To keep the path for future sessions, add the same line to ~/.profile or your shell's profile file."
