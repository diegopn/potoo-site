<!doctype html>
<html lang="{{ page.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="{{ page.destination | absolute_url | escape }}">
    <meta http-equiv="refresh" content="0; url={{ page.destination | relative_url | escape }}">
    <title>{{ page.title | escape }}</title>
  </head>
  <body>
    <p>{{ page.message | escape }} <a href="{{ page.destination | relative_url | escape }}">{{ page.link_text | escape }}</a>.</p>
  </body>
</html>
